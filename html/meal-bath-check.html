<!-- meal-bath-check.html 수정 부분 -->

<style>
/* 기존 CSS 대신 아래로 교체 */

.check-action-row{
    display:grid;
    grid-template-columns:380px auto auto;
    gap:12px;
    align-items:end;
    margin-top:22px;
}

.check-field input[type="file"]{
    width:380px;
    height:42px;
    padding:6px 10px;
    border:1px solid #d8dfec;
    border-radius:10px;
    background:#fff;
    box-sizing:border-box;
}

@media (max-width:900px){
    .check-action-row{
        grid-template-columns:1fr;
    }

    .check-field input[type="file"]{
        width:100%;
    }
}
</style>

<!-- HTML은 그대로 두고 아래 구조를 사용 -->

<div class="check-action-row">

    <div class="check-field">
        <label for="excelFile">장기요양급여 제공기록지 파일</label>
        <input type="file" id="excelFile" accept=".xlsx,.xls">
    </div>

    <button class="check-btn" id="checkBtn" type="button">
        검사 시작
    </button>

    <button class="check-btn danger" id="resetBtn" type="button">
        초기화
    </button>

</div>
